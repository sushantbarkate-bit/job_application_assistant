# ==========================================
# JOB SEARCH CONFIGURATION
# ==========================================


search:
  provider: greenhouse

  keywords:
    - Angular Developer
    - Frontend Developer
    - Java Full Stack Developer

  max_jobs_per_run: 50
  min_match_score: 50

  greenhouse_board_tokens:
    - stripe
    - gitlab
    - coinbase

  sources:
    - name: LinkedIn
      url: "https://www.linkedin.com/jobs/"
      enabled: true

    - name: Naukri
      url: "https://www.naukri.com/"
      enabled: true



# ==========================================
# APPLICATION WORKFLOW
# ==========================================

workflow:

  # Require your approval before submission
  require_approval_before_submit: true

  # Maximum intended applications per day
  daily_application_limit: 15

  # Domains permitted for browser form filling
  # This does not enable job discovery automatically
  allowed_domains:
    - linkedin.com
    - naukri.com

  # Application reports directory
  report_dir: "./reports"

  # Application database
  database_path: "./data/applications.sqlite3"
